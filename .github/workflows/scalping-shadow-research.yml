name: Scalping Shadow Research

on:
  push:
    branches:
      - scalping-v1
    paths:
      - ".github/workflows/scalping-shadow-research.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Record two minutes of live public microstructure
        run: |
          mkdir -p artifacts validation
          python -m signalgrid.ops.run_scalping_shadow \
            --symbols BTCUSDT \
            --minutes 2 \
            --db artifacts/shadow-research.db
      - name: Analyze predefined microstructure cells
        run: |
          python -m signalgrid.backtest.scalping_shadow_research_cli \
            --db artifacts/shadow-research.db \
            --symbol BTCUSDT \
            --min-samples 10 \
            --output validation/scalping_shadow_research.json
      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: scalping-shadow-research
          path: |
            validation/scalping_shadow_research.json
            artifacts/shadow-research.db
          retention-days: 14

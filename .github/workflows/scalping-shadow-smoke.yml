name: Scalping Shadow Smoke

on:
  push:
    branches:
      - scalping-v1
    paths:
      - ".github/workflows/scalping-shadow-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Record public microstructure for 20 seconds
        run: |
          mkdir -p artifacts
          python -m signalgrid.ops.run_scalping_shadow \
            --symbols BTCUSDT \
            --minutes 0.333333 \
            --db artifacts/shadow-smoke.db
      - name: Validate captured rows
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("artifacts/shadow-smoke.db")
          rows = db.execute("SELECT COUNT(*) FROM microstructure_1s").fetchone()[0]
          symbols = db.execute("SELECT COUNT(DISTINCT symbol) FROM microstructure_1s").fetchone()[0]
          print({"rows": rows, "symbols": symbols})
          trades = db.execute("SELECT COALESCE(SUM(trade_count),0) FROM microstructure_1s").fetchone()[0]
          depth_nonzero = db.execute(
              "SELECT COUNT(*) FROM microstructure_1s WHERE ABS(depth_imbalance_20) > 0"
          ).fetchone()[0]
          print({"rows": rows, "symbols": symbols, "trades": trades, "depth_nonzero": depth_nonzero})
          assert rows >= 10
          assert symbols == 1
          assert trades > 0
          assert depth_nonzero > 0
          PY
      - name: Upload smoke DB
        uses: actions/upload-artifact@v4
        with:
          name: scalping-shadow-smoke
          path: artifacts/shadow-smoke.db
          retention-days: 7

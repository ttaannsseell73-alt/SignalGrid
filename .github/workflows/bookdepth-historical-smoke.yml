name: BookDepth Historical Smoke

on:
  push:
    branches:
      - scalping-v1
    paths:
      - ".github/workflows/bookdepth-historical-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Download pre-September BTC bookDepth sample
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          from signalgrid.ops.download_scalping_data import download_dataset

          day = date(2026, 8, 18)
          archives, rows = download_dataset(
              dataset="bookDepth",
              symbol="BTCUSDT",
              start=day,
              end=day,
              output_csv=Path("data/bookdepth/BTCUSDT-bookDepth.csv"),
          )
          print({"archives": archives, "rows": rows})
          PY
      - name: Validate bookDepth quality
        run: |
          mkdir -p validation
          python - <<'PY'
          import json
          from pathlib import Path
          from signalgrid.backtest.bookdepth import load_bookdepth_csv, depth_quality_report

          snapshots = load_bookdepth_csv("data/bookdepth/BTCUSDT-bookDepth.csv", "BTCUSDT")
          report = depth_quality_report(snapshots)
          assert report["snapshots"] > 1000
          assert 20_000 <= report["median_interval_ms"] <= 40_000
          assert report["frozen_inner_ask_fraction"] < 0.95
          assert report["frozen_inner_bid_fraction"] < 0.95
          Path("validation/bookdepth_smoke.json").write_text(
              json.dumps(report, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bookdepth-historical-smoke
          path: validation/bookdepth_smoke.json
          retention-days: 30

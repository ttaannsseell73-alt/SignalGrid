name: Scalping Research Matrix

on:
  push:
    branches:
      - scalping-v1
    paths:
      - ".github/workflows/scalping-research-matrix.yml"
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT
      DAYS: "30"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Resolve cache key
        id: cache_key
        shell: bash
        run: |
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "symbols=$(echo "$SYMBOLS" | tr ',' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore historical cache
        id: data_cache
        uses: actions/cache/restore@v4
        with:
          path: data/scalping
          key: scalping-kline-v1-${{ steps.cache_key.outputs.day }}-${{ env.DAYS }}-${{ steps.cache_key.outputs.symbols }}

      - name: Download data if cache missed
        if: steps.data_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/scalping
          IFS=',' read -ra ITEMS <<< "$SYMBOLS"
          for raw in "${ITEMS[@]}"; do
            symbol="$(echo "$raw" | xargs | tr '[:lower:]' '[:upper:]')"
            python -m signalgrid.ops.download_scalping_data --symbol "$symbol" --days "$DAYS" --output-dir data/scalping
          done

      - name: Run pre-declared filter matrix
        run: |
          mkdir -p validation
          python -m signalgrid.backtest.scalping_hypothesis_cli             --symbols "$SYMBOLS"             --data-dir data/scalping             --output validation/scalping_hypothesis_matrix.json

      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: scalping-research-matrix
          path: validation/scalping_hypothesis_matrix.json
          retention-days: 30

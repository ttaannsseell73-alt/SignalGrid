name: Runtime Public Stream Smoke

on:
  push:
    branches:
      - scalping-v1
    paths:
      - ".github/workflows/runtime-public-stream-smoke.yml"
      - "src/signalgrid/market/public_stream.py"
      - "src/signalgrid/runtime.py"
      - "tests/test_public_stream.py"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify live split market transport
        run: |
          python - <<'PY'
          import asyncio
          import json

          from signalgrid.market.public_stream import BinancePublicStreamTransport, PublicStreamConfig

          async def main():
              stop = asyncio.Event()
              seen = {"aggTrade": 0, "bookTicker": 0}

              def on_event(event):
                  seen[event.kind] = seen.get(event.kind, 0) + 1
                  if seen["aggTrade"] > 0 and seen["bookTicker"] > 0:
                      stop.set()

              transport = BinancePublicStreamTransport(
                  config=PublicStreamConfig(
                      interval="1m",
                      rotate_after_seconds=30,
                      receive_timeout_seconds=2.0,
                  )
              )
              task = asyncio.create_task(
                  transport.run(["BTCUSDT"], on_event=on_event, stop_event=stop)
              )
              try:
                  await asyncio.wait_for(stop.wait(), timeout=15)
              finally:
                  stop.set()
                  try:
                      await asyncio.wait_for(task, timeout=5)
                  except asyncio.TimeoutError:
                      task.cancel()
                      await asyncio.gather(task, return_exceptions=True)

              state = transport.router.state("BTCUSDT")
              result = {
                  "seen": seen,
                  "best_bid": state.best_bid,
                  "best_ask": state.best_ask,
                  "taker_buy_quote": state.taker_buy_quote,
                  "taker_sell_quote": state.taker_sell_quote,
                  "bars": len(state.bars),
                  "last_event_time_ms": state.last_event_time_ms,
              }
              print(json.dumps(result, indent=2, sort_keys=True))
              assert seen["aggTrade"] > 0
              assert seen["bookTicker"] > 0
              assert state.best_bid is not None and state.best_ask is not None
              assert state.taker_buy_quote + state.taker_sell_quote > 0

          asyncio.run(main())
          PY

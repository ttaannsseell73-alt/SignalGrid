name: Scalping Disjoint Candidate Validation

on:
  push:
    branches:
      - scalping-v1
    paths:
      - ".github/workflows/scalping-disjoint-candidate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYMBOLS: BTCUSDT,ETHUSDT
      DAYS: "60"
      END_DATE: "2026-08-19"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Download disjoint historical period
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/scalping-disjoint validation
          IFS=',' read -ra ITEMS <<< "$SYMBOLS"
          for raw in "${ITEMS[@]}"; do
            symbol="$(echo "$raw" | xargs | tr '[:lower:]' '[:upper:]')"
            python -m signalgrid.ops.download_scalping_data               --symbol "$symbol"               --days "$DAYS"               --end-date "$END_DATE"               --output-dir data/scalping-disjoint
          done
      - name: Validate frozen candidate
        id: candidate
        shell: bash
        run: |
          set +e
          python -m signalgrid.backtest.scalping_disjoint_candidate_cli             --symbols "$SYMBOLS"             --data-dir data/scalping-disjoint             --output validation/scalping_disjoint_sweep_long.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload disjoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalping-disjoint-candidate
          path: validation/scalping_disjoint_sweep_long.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce disjoint gate
        shell: bash
        run: |
          code="${{ steps.candidate.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "Frozen candidate rejected by disjoint period."
            exit "$code"
          fi
          echo "Frozen candidate passed disjoint historical gate."

name: Scalping HF Walkforward

on:
  push:
    branches:
      - scalping-v1
    paths:
      - ".github/workflows/scalping-hf-walkforward.yml"
  workflow_dispatch:

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYMBOL: BTCUSDT
      DAYS: "7"
      END_DATE: "2026-09-17"
      BUCKET_MS: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Resolve cache key
        id: cache_key
        shell: bash
        run: |
          echo "key=hf-walkforward-${SYMBOL}-${END_DATE}-${DAYS}-${BUCKET_MS}" >> "$GITHUB_OUTPUT"
      - name: Restore 7-day HF cache
        id: data_cache
        uses: actions/cache/restore@v4
        with:
          path: data/scalping-hf-walkforward
          key: ${{ steps.cache_key.outputs.key }}
      - name: Build 7-day HF dataset
        if: steps.data_cache.outputs.cache-hit != 'true'
        run: |
          python -m signalgrid.ops.download_scalping_hf \
            --symbol "$SYMBOL" \
            --days "$DAYS" \
            --end-date "$END_DATE" \
            --bucket-ms "$BUCKET_MS" \
            --output-dir data/scalping-hf-walkforward
      - name: Save 7-day HF cache
        if: steps.data_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/scalping-hf-walkforward
          key: ${{ steps.cache_key.outputs.key }}
      - name: Run walk-forward feature-family study
        run: |
          mkdir -p validation
          python -m signalgrid.backtest.scalping_hf_walkforward_cli \
            --symbol "$SYMBOL" \
            --bars "data/scalping-hf-walkforward/${SYMBOL}-${BUCKET_MS}ms.csv" \
            --lookback 24 \
            --output validation/scalping_hf_walkforward.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: scalping-hf-walkforward
          path: validation/scalping_hf_walkforward.json
          retention-days: 30

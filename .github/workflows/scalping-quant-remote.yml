name: Scalping Quant Remote

on:
  push:
    branches:
      - scalping-v1
    paths:
      - ".github/workflows/scalping-quant-remote.yml"
      - "src/signalgrid/scalping_profile.py"
      - "src/signalgrid/sonar/**"
      - "src/signalgrid/signals/scalping.py"
      - "src/signalgrid/backtest/scalping_validation.py"
      - "src/signalgrid/backtest/scalping_portfolio_cli.py"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols"
        required: false
        default: "BTCUSDT,ETHUSDT,SOLUSDT"
      days:
        description: "Historical days"
        required: false
        default: "30"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYMBOLS: ${{ github.event.inputs.symbols || 'BTCUSDT,ETHUSDT,SOLUSDT' }}
      DAYS: ${{ github.event.inputs.days || '30' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Resolve UTC cache day
        id: cache_day
        shell: bash
        run: |
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "symbols=$(echo "$SYMBOLS" | tr ',' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore historical kline cache
        id: data_cache
        uses: actions/cache/restore@v4
        with:
          path: data/scalping
          key: scalping-kline-v1-${{ steps.cache_day.outputs.day }}-${{ env.DAYS }}-${{ steps.cache_day.outputs.symbols }}

      - name: Download historical klines
        if: steps.data_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/scalping validation
          IFS=',' read -ra ITEMS <<< "$SYMBOLS"
          for raw in "${ITEMS[@]}"; do
            symbol="$(echo "$raw" | xargs | tr '[:lower:]' '[:upper:]')"
            [ -n "$symbol" ] || continue
            echo "Downloading $symbol / $DAYS days"
            python -m signalgrid.ops.download_scalping_data               --symbol "$symbol"               --days "$DAYS"               --output-dir data/scalping
          done

      - name: Save historical kline cache
        if: steps.data_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/scalping
          key: scalping-kline-v1-${{ steps.cache_day.outputs.day }}-${{ env.DAYS }}-${{ steps.cache_day.outputs.symbols }}

      - name: Run multi-symbol no-lookahead quant gate
        id: quant
        shell: bash
        run: |
          mkdir -p validation
          set +e
          python -m signalgrid.backtest.scalping_portfolio_cli             --symbols "$SYMBOLS"             --data-dir data/scalping             --gate-output validation/scalping_gate.json             > validation/portfolio_report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat validation/portfolio_report.json
          exit 0

      - name: Write metadata
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "symbols": os.environ["SYMBOLS"],
              "days": int(os.environ["DAYS"]),
              "quant_exit_code": int("${{ steps.quant.outputs.exit_code }}"),
              "commit": os.environ.get("GITHUB_SHA", ""),
          }
          Path("validation/remote_run_metadata.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY

      - name: Upload quant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalping-quant-evidence
          path: validation/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce quant gate
        shell: bash
        run: |
          code="${{ steps.quant.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "Scalping quant gate failed with exit code $code"
            exit "$code"
          fi
          test -f validation/scalping_gate.json
          echo "Scalping quant gate PASS"

# validation-revision: 6-sonar-canonical-profile

name: Scalping BookDepth Walkforward

on:
  push:
    branches:
      - scalping-v1
    paths:
      - ".github/workflows/scalping-bookdepth-walkforward.yml"
  workflow_dispatch:

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYMBOL: BTCUSDT
      DAYS: "7"
      END_DATE: "2026-08-17"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Resolve cache key
        id: key
        run: echo "key=bookdepth-wf-${SYMBOL}-${END_DATE}-${DAYS}" >> "$GITHUB_OUTPUT"
      - name: Restore dataset cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/bookdepth-walkforward
          key: ${{ steps.key.outputs.key }}
      - name: Build 30s aggTrades bars
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m signalgrid.ops.download_scalping_hf \
            --symbol "$SYMBOL" \
            --days "$DAYS" \
            --end-date "$END_DATE" \
            --bucket-ms 30000 \
            --output-dir data/bookdepth-walkforward
      - name: Download bookDepth
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from pathlib import Path
          from signalgrid.ops.download_scalping_data import download_dataset

          end = datetime.strptime("2026-08-17", "%Y-%m-%d").date()
          start = end - timedelta(days=6)
          download_dataset(
              dataset="bookDepth",
              symbol="BTCUSDT",
              start=start,
              end=end,
              output_csv=Path("data/bookdepth-walkforward/BTCUSDT-bookDepth.csv"),
          )
          PY
      - name: Save dataset cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/bookdepth-walkforward
          key: ${{ steps.key.outputs.key }}
      - name: Run bookDepth walk-forward
        run: |
          mkdir -p validation
          python -m signalgrid.backtest.scalping_bookdepth_walkforward_cli \
            --symbol "$SYMBOL" \
            --bars "data/bookdepth-walkforward/${SYMBOL}-30000ms.csv" \
            --bookdepth "data/bookdepth-walkforward/${SYMBOL}-bookDepth.csv" \
            --output validation/bookdepth_walkforward.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: scalping-bookdepth-walkforward
          path: validation/bookdepth_walkforward.json
          retention-days: 30

name: Scalping BookDepth Disjoint

on:
  push:
    branches:
      - scalping-v1
    paths:
      - ".github/workflows/scalping-bookdepth-disjoint.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYMBOL: BTCUSDT
      DAYS: "7"
      END_DATE: "2026-08-17"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build 30s aggTrades bars
        run: |
          python -m signalgrid.ops.download_scalping_hf \
            --symbol "$SYMBOL" \
            --days "$DAYS" \
            --end-date "$END_DATE" \
            --bucket-ms 30000 \
            --output-dir data/bookdepth-disjoint
      - name: Download seven days bookDepth
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from pathlib import Path
          from signalgrid.ops.download_scalping_data import download_dataset

          end = datetime.strptime("2026-08-17", "%Y-%m-%d").date()
          start = end - timedelta(days=6)
          download_dataset(
              dataset="bookDepth",
              symbol="BTCUSDT",
              start=start,
              end=end,
              output_csv=Path("data/bookdepth-disjoint/BTCUSDT-bookDepth.csv"),
          )
          PY
      - name: Validate frozen bookDepth candidate
        id: gate
        shell: bash
        run: |
          mkdir -p validation
          set +e
          python -m signalgrid.backtest.scalping_bookdepth_disjoint_cli \
            --symbol "$SYMBOL" \
            --bars "data/bookdepth-disjoint/${SYMBOL}-30000ms.csv" \
            --bookdepth "data/bookdepth-disjoint/${SYMBOL}-bookDepth.csv" \
            --min-samples 100 \
            --output validation/bookdepth_disjoint_candidate.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalping-bookdepth-disjoint
          path: validation/bookdepth_disjoint_candidate.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce disjoint gate
        run: |
          code="${{ steps.gate.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "Frozen bookDepth candidate rejected."
            exit "$code"
          fi
          echo "Frozen bookDepth candidate passed disjoint historical gate."

name: Scalping BookDepth Research

on:
  push:
    branches:
      - scalping-v1
    paths:
      - ".github/workflows/scalping-bookdepth-research.yml"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SYMBOL: BTCUSDT
      END_DATE: "2026-08-18"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build 30s aggTrades bars
        run: |
          python -m signalgrid.ops.download_scalping_hf \
            --symbol "$SYMBOL" \
            --days 1 \
            --end-date "$END_DATE" \
            --bucket-ms 30000 \
            --output-dir data/bookdepth-research
      - name: Download bookDepth
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from signalgrid.ops.download_scalping_data import download_dataset

          day = datetime.strptime("2026-08-18", "%Y-%m-%d").date()
          download_dataset(
              dataset="bookDepth",
              symbol="BTCUSDT",
              start=day,
              end=day,
              output_csv=Path("data/bookdepth-research/BTCUSDT-bookDepth.csv"),
          )
          PY
      - name: Run bookDepth microstructure research
        run: |
          mkdir -p validation
          python -m signalgrid.backtest.scalping_bookdepth_research_cli \
            --symbol "$SYMBOL" \
            --bars "data/bookdepth-research/${SYMBOL}-30000ms.csv" \
            --bookdepth "data/bookdepth-research/${SYMBOL}-bookDepth.csv" \
            --min-samples 20 \
            --output validation/bookdepth_microstructure_research.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: scalping-bookdepth-research
          path: validation/bookdepth_microstructure_research.json
          retention-days: 30

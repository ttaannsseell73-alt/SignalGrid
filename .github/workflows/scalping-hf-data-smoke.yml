name: Scalping HF Data Smoke

on:
  push:
    branches:
      - scalping-v1
    paths:
      - ".github/workflows/scalping-hf-data-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Download one day BTC aggTrades and build 5s bars
        run: |
          python -m signalgrid.ops.download_scalping_hf             --symbol BTCUSDT             --days 1             --bucket-ms 5000             --output-dir data/scalping-hf
      - name: Validate 5s bars
        run: |
          mkdir -p validation
          python - <<'PY'
          import json
          from pathlib import Path
          from signalgrid.backtest.data import load_binance_klines_csv

          path = Path("data/scalping-hf/BTCUSDT-5000ms.csv")
          bars = load_binance_klines_csv(path, "BTCUSDT")
          assert len(bars) > 1000
          assert all(b.open_time_ms < b.close_time_ms for b in bars)
          assert all(b.open_time_ms % 5000 == 0 for b in bars)
          assert all(
              right.open_time_ms - left.open_time_ms == 5000
              for left, right in zip(bars, bars[1:])
          )
          payload = {
              "symbol": "BTCUSDT",
              "bucket_ms": 5000,
              "bars": len(bars),
              "first_open_ms": bars[0].open_time_ms,
              "last_close_ms": bars[-1].close_time_ms,
              "quote_volume": sum(b.quote_volume for b in bars),
              "taker_buy_quote": sum(b.taker_buy_quote for b in bars),
          }
          Path("validation/hf_data_smoke.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: scalping-hf-data-smoke
          path: validation/hf_data_smoke.json
          retention-days: 30
